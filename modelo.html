<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>YouTube</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="cabecalho">
            <div class="cabecalho__inicio">
                <button class="botao-icone" title="Menu">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <a href="#" class="logotipo">
                    <i class="fa-brands fa-youtube logotipo__icone"></i>
                    <span class="logotipo__texto">YouTube</span>
                    <span class="logotipo__pais">BR</span>
                </a>
            </div>

            <div class="cabecalho__centro">
                <form class="campo-pesquisa" onsubmit="return false;">
                    <input
                        type="text"
                        class="campo-pesquisa__entrada"
                        placeholder="Pesquisar"
                    >
                    <button class="campo-pesquisa__botao" title="Pesquisar">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </form>
                <button class="botao-icone botao-icone--circular" title="Pesquisar com sua voz">
                    <i class="fa-solid fa-microphone"></i>
                </button>
            </div>

            <div class="cabecalho__fim">
                <button class="botao-icone" title="Criar">
                    <i class="fa-solid fa-video"></i>
                </button>
                <button class="botao-icone" title="Notificações">
                    <i class="fa-solid fa-bell"></i>
                </button>
                <button class="avatar-usuario" title="Sua conta">V</button>
            </div>
        </header>

        <main class="conteudo">
            <nav class="menu-lateral" id="menuLateral"></nav>

            <div class="area-principal">
                <section class="area-player" id="areaPlayer"></section>
                <aside class="recomendacoes" id="recomendacoes"></aside>
            </div>
        </main>

        <script src="script.js"></script>
    </body>
</html>
