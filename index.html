<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EuTube</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
</head>
<body>
    <header class="cabecalho">
        <div class="cabecalho-inicio">
            <i class="fa-solid fa-bars"></i>
            <div class="logotipo">
                <i class="fa-brands fa-youtube logotipo-icone"></i>
                <span class="logotipo-nome">EuTube</span>
                <span class="logotipo-pais">BR</span>
            </div>
        </div>
        </div>
        <div class="cabecalho-centro">
            <div class="search">
                <input type="text" name="search" id="search-input" class="search-input">
                <button class="search-button">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
                <button class="microphone-button">
                    <i class="fa-solid fa-microphone"></i>
                </button>
            </div>
        </div>
        <div class="cabecalho-final">
            <div>
                <button class="logotipo-video" title="criar">
                    <i class="fa-solid fa-video"></i>
                </button>
                <button class="logotipo-notificação" title="notificações">
                    <i class="fa-solid fa-bell"></i>
                </button>
                <button class="logotipo-conta" title="sua conta">
                    <i class=""></i>
                </button>
            </div>
        </div>
    </header>

    <script src="script.js"></script>
</body>
</html>
